[project]
name = "daytrip-flights"
version = "0.1.0"
description = "Find the cheapest same-day round-trip dates between Seoul and Japan (Google Flights + Naver)."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "faster-flights==3.8.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.1",
    "pyyaml>=6.0.3",
    "typer>=0.27.3",
]

[project.scripts]
daytrip = "daytrip_flights.cli:app"

[build-system]
requires = ["uv_build>=0.11.29,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
